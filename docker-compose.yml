# 로컬·서버 공용.
#  로컬:  GATEWAY_PORT=8000 docker compose up --build  →  http://localhost:8000
#  서버:  docker compose up -d --build                 →  http://<서버IP>  (배포 절차: deploy/README.md)
services:
  api:
    build: ./api/runNshop-api
    restart: unless-stopped
  mobile:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args: { APP: runNshop-mobile, PORT: "3000", BASE_PATH: "" }
    restart: unless-stopped
  admin:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args: { APP: runNshop-admin, PORT: "3001", BASE_PATH: /admin }
    restart: unless-stopped
  partner:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args: { APP: runNshop-partner, PORT: "3002", BASE_PATH: /partner }
    restart: unless-stopped
  docs:
    build:
      context: .
      dockerfile: deploy/docs/Dockerfile
    restart: unless-stopped
  plantuml:
    # docsify 의 PlantUML 렌더링 (내부 문서를 외부 서버로 보내지 않기 위해 자체 호스팅)
    image: plantuml/plantuml-server:jetty-v1.2026.8
    mem_limit: 512m
    restart: unless-stopped
  gateway:
    build: ./deploy/nginx
    ports: ["${GATEWAY_PORT:-80}:80"]
    environment:
      API_HOST: api
      MOBILE_HOST: mobile
      ADMIN_HOST: admin
      PARTNER_HOST: partner
      DOCS_HOST: docs
      PLANTUML_HOST: plantuml
      DOCS_USER: ${DOCS_USER:-docs}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}  # 필수 (.env). 비어 있으면 게이트웨이가 기동하지 않음
    depends_on: [api, mobile, admin, partner, docs, plantuml]
    restart: unless-stopped
