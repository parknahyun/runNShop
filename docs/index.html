<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>runNshop 문서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
</head>
<body>
  <div id="app">문서 불러오는 중…</div>
  <script>
    window.$docsify = {
      name: 'runNshop 문서',
      repo: '',
      // 사이드바는 scripts/gen-docs-sidebar.js 가 생성 (docs/_sidebar.md, git 제외)
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: '문서 검색',
        noData: '결과 없음',
        depth: 3,
        // 한글 파일명·397개 문서 기준. 검색 인덱스는 브라우저에서 만든다.
      },
      sidebarDisplayLevel: 1,
      // PlantUML 은 외부(plantuml.com) 대신 자체 서버로 렌더링 (내부 문서 유출 방지)
      plantuml: {
        skin: 'classic',
        serverPath: location.pathname.indexOf('/docs/') === 0
          ? location.origin + '/plantuml/svg/'
          : 'http://localhost:8081/svg/',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plantuml@1.3.2/dist/docsify-plantuml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
</body>
</html>
